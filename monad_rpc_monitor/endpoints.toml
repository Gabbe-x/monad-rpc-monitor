# monad-rpc-monitor configuration.
#
# Only public, keyless endpoints are listed. Rate-limited answers (HTTP 429) are
# reported as "rate_limited" rather than "down" so that free tiers are not
# misrepresented as outages. Add your own endpoints (including private ones) below.

[general]
interval_s = 30          # probe cycle length
history_window_h = 24    # uptime / latency window shown on the status page
listen = "0.0.0.0:8080"
db_path = "monad-rpc-monitor.db"

[thresholds]
lag_blocks = 20          # blocks behind the best head -> "lagging"
slow_ms = 1500           # eth_blockNumber slower than this -> "slow"
timeout_s = 8.0
consistency_depth = 30   # block (best_head - depth) is compared across endpoints
method_probe_every = 12  # full method-support probe every N cycles (12 * 30s = 6 min)

[alerts]
# Optional. Set MONAD_RPC_MONITOR_TELEGRAM_TOKEN / _CHAT_ID env vars or fill in below.
# telegram_bot_token = ""
# telegram_chat_id = ""
# webhook_url = ""            # generic JSON POST (Discord / Slack compatible payload)
# min_incident_s = 90         # do not alert on blips shorter than this

[networks.mainnet]
chain_id = 143
display = "Monad Mainnet"
explorer = "https://monadvision.com"

[networks.testnet]
chain_id = 10143
display = "Monad Testnet"
explorer = "https://testnet.monadvision.com"

